name: CI

# Path-filtered so a Kotlin-only change never starts a macOS runner. The Android side has
# its own workflow (android.yml). `workflow_dispatch` is deliberately unfiltered so this can
# always be run by hand.
#
# The two filters are mirror images with ONE deliberate exception: a change under
# `contracts/**` fires both, because that directory holds fixtures both suites decode and the
# point of it is that a wire-shape change breaks whichever platform did not change. Do not
# "fix" the overlap by adding contracts/** to the ignore list below — that disables the drift
# protection while leaving the directory looking guarded.
on:
  pull_request:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches:
      - main
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Tests only need to read the checkout. Keep the automatically issued token
# incapable of mutating the repository when this workflow runs on a PR.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 26 is required for the iOS 26.4 SDK and Foundation Models APIs.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install verified XcodeGen
        run: |
          XCODEGEN_BIN_DIR="$(sh ci_scripts/install_xcodegen.sh "$RUNNER_TEMP/xcodegen-dist")"
          echo "$XCODEGEN_BIN_DIR" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Verify release assets
        run: sh ci_scripts/verify_assets.sh

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Ondas.xcodeproj \
            -scheme Ondas \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
