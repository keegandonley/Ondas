name: CI

# Path-filtered so a Kotlin- or TypeScript-only change never starts a macOS runner. The other
# two platforms have their own workflows (android.yml, web.yml), and `website/` is the marketing
# site, which this workflow has no tests for. `workflow_dispatch` is deliberately unfiltered so
# this can always be run by hand.
#
# The filters are mirror images with TWO deliberate overlaps, and a shared artifact only stops
# drift if changing it runs the platform that did NOT change:
#
#   1. `contracts/**` fires this AND android.yml — it holds fixtures both suites decode, so a
#      wire-shape change must break whichever platform did not change. Do not "fix" the overlap
#      by adding contracts/** to the ignore list below; that disables the drift protection while
#      leaving the directory looking guarded.
#
#   2. `Ondas/Resources/Assets.xcassets/**` fires this AND web.yml — web/src/design/Theme.test.ts
#      reads the accent colorset in place, so editing the iOS brand must run the web build too.
#      It is absent from the ignore list below for that reason: it is Swift-side source, and this
#      workflow owns it.
#
# `website/**` is ignored but has NO workflow of its own: it is deployed by Vercel from its own
# root directory and has no test suite here. Ignoring it is not a gap — running a 45-minute macOS
# Xcode job for a copy change was.
on:
  pull_request:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'web/**'
      - '.github/workflows/web.yml'
      - 'website/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'web/**'
      - '.github/workflows/web.yml'
      - 'website/**'
  workflow_dispatch:

# Tests only need to read the checkout. Keep the automatically issued token
# incapable of mutating the repository when this workflow runs on a PR.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 26 is required for the iOS 26.4 SDK and Foundation Models APIs.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install verified XcodeGen
        run: |
          XCODEGEN_BIN_DIR="$(sh ci_scripts/install_xcodegen.sh "$RUNNER_TEMP/xcodegen-dist")"
          echo "$XCODEGEN_BIN_DIR" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Verify release assets
        run: sh ci_scripts/verify_assets.sh

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Ondas.xcodeproj \
            -scheme Ondas \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
