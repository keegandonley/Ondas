# Builds the direct-distribution (non-Mac-App-Store) macOS build WITH the menu-bar item, notarizes
# it, publishes a GitHub Release, and bumps the Homebrew cask in keegandonley/homebrew-tap.
#
# Trigger: push a tag like `v1.2.0`. MARKETING_VERSION comes from the tag; CURRENT_PROJECT_VERSION
# from the run number. The App Store / TestFlight build stays on Xcode Cloud (the clean `Release`
# config); this workflow only ever builds the `Ondas Direct` scheme / `Distribute` config.
#
# Required repository secrets:
#   DEVELOPER_ID_CERT_P12_BASE64  base64 of the "Developer ID Application" cert + key, exported as .p12
#   DEVELOPER_ID_CERT_PASSWORD    password protecting that .p12
#   KEYCHAIN_PASSWORD             any string; unlocks the throwaway CI keychain
#   ASC_API_KEY_P8_BASE64         base64 of an App Store Connect API key (.p8) — used for BOTH
#                                 -allowProvisioningUpdates (Developer ID profiles) and notarytool
#   ASC_API_KEY_ID               the key's Key ID
#   ASC_API_ISSUER_ID            the key's Issuer ID
#   DEVELOPER_ID_PROFILE_APP_BASE64    base64 of the app's Developer ID provisioning profile
#   DEVELOPER_ID_PROFILE_AGENT_BASE64  base64 of the menu-bar agent's Developer ID profile
#   HOMEBREW_TAP_TOKEN           PAT (contents:write) for keegandonley/homebrew-tap
name: Release (Direct)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create GitHub Releases in this repo

concurrency:
  group: release-direct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS 26 image — provides the Xcode 26 toolchain with the iOS/macOS 26.4 SDK the app needs.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_NAME: Ondas
      SCHEME: Ondas Direct
      CONFIGURATION: Distribute
      # Repository variables let a fork opt into its own signing and cask identities while keeping
      # the current release channel working until those variables are configured.
      TEAM_ID: ${{ vars.ONDAS_DEVELOPMENT_TEAM || '3D997JL57S' }}
      MAIN_APP_BUNDLE_IDENTIFIER: ${{ vars.ONDAS_MAIN_APP_BUNDLE_IDENTIFIER || 'com.keegancodes.ondas' }}
      MENU_BAR_URL_SCHEME: ${{ vars.ONDAS_MENU_BAR_URL_SCHEME || 'ondas-menubar' }}
      TAP_REPO: ${{ vars.ONDAS_HOMEBREW_TAP_REPOSITORY || 'keegandonley/homebrew-tap' }}
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # The release token is only needed by the explicit `gh release` command below.
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install verified XcodeGen
        run: |
          XCODEGEN_BIN_DIR="$(sh ci_scripts/install_xcodegen.sh "$RUNNER_TEMP/xcodegen-dist")"
          echo "$XCODEGEN_BIN_DIR" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Verify release assets
        run: sh ci_scripts/verify_assets.sh

      - name: Derive version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "error: release tag must be v<semantic-version>; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing Ondas $VERSION (build ${GITHUB_RUN_NUMBER})"

      - name: Run unit tests
        # Run before importing any signing or notarization secrets. Release tags do not otherwise
        # pass through the pull-request/main CI workflow.
        run: |
          xcodebuild test \
            -project "${APP_NAME}.xcodeproj" \
            -scheme Ondas \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          : "${CERT_P12_BASE64:?error: DEVELOPER_ID_CERT_P12_BASE64 is required}"
          : "${CERT_PASSWORD:?error: DEVELOPER_ID_CERT_PASSWORD is required}"
          : "${KEYCHAIN_PASSWORD:?error: KEYCHAIN_PASSWORD is required}"
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Allow codesign/productbuild to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Make the CI keychain searchable alongside the login keychain.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          : "${ASC_KEY_P8_BASE64:?error: ASC_API_KEY_P8_BASE64 is required}"
          umask 077
          API_KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (Mac Catalyst)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          # Pass tag-derived values through env (never interpolate ${{ }} into a run script directly).
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild archive \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/${APP_NAME}.xcarchive" \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ONDAS_DEVELOPMENT_TEAM="$TEAM_ID" \
            ONDAS_MAIN_APP_BUNDLE_IDENTIFIER="$MAIN_APP_BUNDLE_IDENTIFIER" \
            ONDAS_MENU_BAR_AGENT_BUNDLE_IDENTIFIER="${MAIN_APP_BUNDLE_IDENTIFIER}.MenuBar" \
            ONDAS_TEST_BUNDLE_IDENTIFIER="${MAIN_APP_BUNDLE_IDENTIFIER}.tests" \
            ONDAS_ICLOUD_CONTAINER_IDENTIFIER="iCloud.${MAIN_APP_BUNDLE_IDENTIFIER}" \
            ONDAS_IOS_APP_GROUP_IDENTIFIER="group.${MAIN_APP_BUNDLE_IDENTIFIER}" \
            ONDAS_MAC_APP_GROUP_IDENTIFIER="${TEAM_ID}.${MAIN_APP_BUNDLE_IDENTIFIER}" \
            ONDAS_UBIQUITY_KVSTORE_IDENTIFIER="${TEAM_ID}.${MAIN_APP_BUNDLE_IDENTIFIER}" \
            ONDAS_KEYCHAIN_ACCESS_GROUP="${TEAM_ID}.${MAIN_APP_BUNDLE_IDENTIFIER}.shared" \
            ONDAS_MENU_BAR_URL_SCHEME="$MENU_BAR_URL_SCHEME" \
            ENABLE_HARDENED_RUNTIME=YES \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Install Developer ID provisioning profiles
        # Developer ID distribution of an app with restricted entitlements (iCloud/CloudKit, App
        # Group, keychain sharing, push) needs real provisioning profiles that automatic "cloud"
        # signing cannot self-provision. Decode the two manually-created profiles, install them, and
        # generate a manual-signing exportOptions plist by reading each profile's own bundle id +
        # name (so nothing here hardcodes profile names or which secret maps to which target).
        env:
          PROFILE_APP_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_APP_BASE64 }}
          PROFILE_AGENT_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_AGENT_BASE64 }}
        run: |
          umask 077
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          XCODE_PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR" "$XCODE_PROFILE_DIR"
          EXPORT_PLIST="$RUNNER_TEMP/exportOptions.plist"
          cat > "$EXPORT_PLIST" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>provisioningProfiles</key>
            <dict/>
          </dict>
          </plist>
          PLIST
          install_one() {
            b64="$1"
            if [ -z "$b64" ]; then
              echo "error: a DEVELOPER_ID_PROFILE_*_BASE64 secret is empty" >&2
              exit 1
            fi
            raw="$RUNNER_TEMP/profile.provisionprofile"
            printf '%s' "$b64" | base64 --decode > "$raw"
            dec="$RUNNER_TEMP/profile.plist"
            security cms -D -i "$raw" > "$dec"
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$dec")
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$dec")
            appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$dec" 2>/dev/null) \
              || appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$dec")
            bundleid="${appid#*.}" # strip the "TEAMID." prefix (team id has no dots)
            cp "$raw" "$PROFILE_DIR/$uuid.provisionprofile"
            cp "$raw" "$XCODE_PROFILE_DIR/$uuid.provisionprofile"
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${bundleid} string ${name}" "$EXPORT_PLIST"
            echo "installed profile '${name}' (${uuid}) -> ${bundleid}"
          }
          install_one "$PROFILE_APP_BASE64"
          install_one "$PROFILE_AGENT_BASE64"
          echo "EXPORT_PLIST=$EXPORT_PLIST" >> "$GITHUB_ENV"
          echo "--- generated exportOptions ---"
          cat "$EXPORT_PLIST"

      - name: Export (Developer ID)
        # Manual signing: uses the imported Developer ID cert + the profiles installed above. No API
        # key / -allowProvisioningUpdates here — cloud signing can't vend Developer ID profiles.
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${APP_NAME}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_PLIST"

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          APP_PATH="$RUNNER_TEMP/export/${APP_NAME}.app"
          # Cheap pre-flight: catch a broken signature (incl. the script-embedded agent) here, with a
          # clear diagnostic, instead of after a multi-minute notarization round-trip.
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          NOTARIZE_ZIP="$RUNNER_TEMP/${APP_NAME}-notarize.zip"
          # notarytool needs a container (zip); it notarizes the .app inside, then we staple the app.
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key "$API_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          # Fail the build if Gatekeeper would reject the stapled app.
          spctl --assess --type execute --verbose "$APP_PATH"

      - name: Package release asset
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH="$RUNNER_TEMP/export/${APP_NAME}.app"
          ASSET="${APP_NAME}-${VERSION}.zip"
          DIST="$RUNNER_TEMP/${ASSET}"
          # Re-zip AFTER stapling so the distributed app carries its notarization ticket offline.
          ditto -c -k --keepParent "$APP_PATH" "$DIST"
          SHA=$(shasum -a 256 "$DIST" | awk '{print $1}')
          echo "path=$DIST" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_PATH: ${{ steps.package.outputs.path }}
          ASSET_NAME: ${{ steps.package.outputs.asset }}
        run: |
          # Idempotent: on a re-run where the release already exists, update its asset instead of
          # hard-failing (`gh release create` errors if the tag already has a release).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSET_PATH}#${ASSET_NAME}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSET_PATH}#${ASSET_NAME}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ondas ${VERSION}" \
              --generate-notes
          fi

      - name: Update Homebrew cask
        env:
          # The credential helper reads GH_TOKEN at use time, so the secret never becomes part of
          # a remote URL or the tap checkout's .git/config.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.package.outputs.sha256 }}
        run: |
          TAP_DIR="$RUNNER_TEMP/tap"
          # Full (not shallow) clone so `git pull --rebase` below works if we lose a push race.
          gh auth setup-git --hostname github.com --force
          git clone "https://github.com/${TAP_REPO}.git" "$TAP_DIR"
          cd "$TAP_DIR" || exit 1
          mkdir -p Casks
          sed -e "s/@@VERSION@@/${VERSION}/" -e "s/@@SHA256@@/${SHA}/" \
            "$GITHUB_WORKSPACE/ci_scripts/ondas.cask.tmpl" > Casks/ondas.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ondas.rb
          # No-op safely if the tag is re-run against an unchanged cask.
          git diff --cached --quiet && { echo "Cask already up to date"; exit 0; }
          git commit -m "ondas ${VERSION}"
          # Retry against a concurrent release pushing the same tap repo (per-tag concurrency doesn't
          # serialize different tags): rebase onto the winner and push again.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "cask push rejected (attempt ${attempt}); rebasing onto latest tap HEAD"
            git pull --rebase
          done
          echo "error: failed to push cask update after 5 attempts" >&2
          exit 1
