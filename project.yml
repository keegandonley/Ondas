name: Ondas
options:
  bundleIdPrefix: com.keegancodes
  deploymentTarget:
    # FoundationModels (Apple Intelligence on-device LLM) and the GA image-generation
    # APIs require iOS 26. Pinned to 26.4 for `SystemLanguageModel.tokenCount`, which
    # backs the real token budget (context meter + capacity warning) for every user.
    iOS: "26.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3D997JL57S
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

# `Distribute` is a Release-type config for building the app WITH the menu-bar item for
# distribution outside the Mac App Store. `Release` (what Xcode Cloud archives) ships without it.
configs:
  Debug: debug
  Release: release
  Distribute: release

targets:
  Ondas:
    type: application
    platform: iOS
    sources:
      - path: Ondas
    info:
      path: Ondas/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ondas
        # Add-only Photos access, requested at save time (never at launch). The app only ever
        # writes generated images to the library; it never reads or lists the user's photos.
        NSPhotoLibraryAddUsageDescription: Save generated images to your photo library.
        # App Store Connect infers the export-compliance answer from the bundle.
        # This app implements no non-exempt encryption.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # CloudKit delivers cross-device sync via silent remote-notification pushes.
        UIBackgroundModes:
          - remote-notification
        # iPad (device family 2) builds must declare supported orientations or App
        # Store validation rejects the binary (ITMS-90474). iPad multitasking requires
        # all four; iPhone omits upside-down per the usual convention.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keegancodes.ondas
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Default build (App Store / what Xcode Cloud archives): base entitlements, NO menu bar. The
        # Mac App Store archive REQUIRES this — a team-scoped App Group + an embedded macOS agent
        # aren't App-Store-distributable. Entitlements are hand-maintained files (no XcodeGen
        # `entitlements:` block, which would generate one). Debug + Distribute flip the menu bar on.
        CODE_SIGN_ENTITLEMENTS: Ondas/Resources/Ondas.entitlements
      configs:
        # Menu-bar builds: add the direct-distribution capabilities (team-scoped App Group + shared
        # keychain group), the `ONDAS_MENUBAR` compile flag, and the embed trigger. Debug (local
        # dev/test) and Distribute (the direct-distribution release). Release stays clean.
        Debug: &ondasMenuBar
          CODE_SIGN_ENTITLEMENTS: Ondas/Resources/Ondas-macCatalyst.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ONDAS_MENUBAR
          ONDAS_INCLUDE_MENUBAR: "YES"
        Distribute: *ondasMenuBar
    dependencies:
      # The macOS menu-bar agent is a plain build dependency; it's EMBEDDED (into
      # Contents/Library/LoginItems, where SMAppService expects it) only by the postBuildScript
      # below, and only in menu-bar builds — the App Store build must not contain it.
      - target: OndasMenuBar
        link: false
        embed: false
    postBuildScripts:
      - name: Embed menu-bar agent
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/ci_scripts/embed_menubar_agent.sh"'

  # Standalone macOS menu-bar agent (its own process). Owns the NSStatusItem + NSPopover and hosts
  # the compact quick-chat. Compiles the SAME core sources as the app (source-shared, not a
  # framework — the app is macabi, the agent is macos, so a shared binary isn't possible while the
  # app still targets iPhone/iPad). Shares data with the app via the App Group store.
  OndasMenuBar:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "26.4"
    sources:
      - path: OndasMenuBar
      - path: Ondas/Models
      - path: Ondas/App/AppModelContainer.swift
      - path: Ondas/Services
        # PhotoLibrarySaver is UIKit/Photos add-only (iOS); the popover doesn't save to Photos.
        excludes:
          - PhotoLibrarySaver.swift
      - path: Ondas/Support/AppInfo.swift
      - path: Ondas/Support/ContainerPreferences.swift
      - path: Ondas/Support/StringExtensions.swift
      - path: Ondas/Support/ModelContextExtensions.swift
      - path: Ondas/Support/Theme.swift
    info:
      path: OndasMenuBar/Info.plist
      properties:
        CFBundleDisplayName: Ondas Menu Bar
        # Agent: no Dock icon, no app menu — lives only in the menu bar.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        # URL scheme the app opens to launch the agent immediately (SMAppService only guarantees
        # launch at login, not in the current session). A sandboxed Catalyst app can't use
        # NSWorkspace, but it can open a URL, which LaunchServices routes to this handler.
        CFBundleURLTypes:
          - CFBundleURLName: com.keegancodes.ondas.MenuBar
            CFBundleURLSchemes:
              - ondas-menubar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keegancodes.ondas.MenuBar
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.4"
        # Never install the agent standalone — it's only ever embedded into the app's LoginItems by
        # embed_menubar_agent.sh. Without this, an archive would drop a stray OndasMenuBar.app next to
        # Ondas.app, which would break App Store eligibility.
        SKIP_INSTALL: true
    entitlements:
      path: OndasMenuBar/OndasMenuBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.keegancodes.ondas
        com.apple.developer.icloud-services:
          - CloudKit
        # ONLY the team-scoped group (the agent shares the store + reads settings from it via
        # ContainerPreferences). No `group.` entry: a native-macOS app is prompted with the "access
        # data from other apps" consent for a `group.` App Group even if unused, whereas the
        # team-scoped container is same-team and silent. (The app keeps `group.` for its iOS builds.)
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.keegancodes.ondas
        # Same shared keychain access group as the app so the agent can read the telemetry key.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.keegancodes.ondas.shared

  OndasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OndasTests
    dependencies:
      - target: Ondas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keegancodes.ondas.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  # App Store / TestFlight scheme (what Xcode Cloud builds). Archives the clean Release config —
  # no menu-bar item — so both the iOS and Mac App Store archives are eligible.
  Ondas:
    build:
      targets:
        Ondas: all
    test:
      targets:
        - OndasTests
    run:
      config: Debug
      # Core Data's CloudKit mirroring only reports a coarse top-level error via
      # NSPersistentCloudKitContainerEvent (e.g. bare "CKErrorDomain error 2" with no
      # partialErrorsByItemID payload) — this is Apple's documented flag for verbose
      # per-record sync logging in Console, needed to see the actual failing record/field.
      commandLineArguments:
        "-com.apple.CoreData.CloudKitDebug 1": true
    archive:
      config: Release

  # Direct-distribution scheme (outside the Mac App Store). Archives the Distribute config, which
  # builds WITH the menu-bar item (ONDAS_MENUBAR flag + App Group/keychain entitlements + embedded
  # agent). Build/sign this yourself for Developer ID / notarized distribution.
  Ondas Direct:
    build:
      targets:
        Ondas: all
    run:
      config: Debug
    archive:
      config: Distribute
