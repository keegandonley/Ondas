name: Ondas
options:
  bundleIdPrefix: com.keegancodes
  deploymentTarget:
    # FoundationModels (Apple Intelligence on-device LLM) and the GA image-generation
    # APIs require iOS 26.
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3D997JL57S
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Ondas:
    type: application
    platform: iOS
    sources:
      - path: Ondas
    info:
      path: Ondas/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ondas
        # App Store Connect infers the export-compliance answer from the bundle.
        # This app implements no non-exempt encryption.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # CloudKit delivers cross-device sync via silent remote-notification pushes.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keegancodes.ondas
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Ondas/Resources/Ondas.entitlements
      properties:
        # Distribution (App Store / TestFlight) builds must request the production
        # APNs environment; the managed distribution profile only grants production.
        # TestFlight and the App Store both route through production APNs.
        aps-environment: production
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.keegancodes.ondas
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.keegancodes.ondas"
        # Sandboxed Mac Catalyst blocks CloudKit traffic without the network-client
        # entitlement; declared here so `xcodegen generate` never drops it.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  OndasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OndasTests
    dependencies:
      - target: Ondas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keegancodes.ondas.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Ondas:
    build:
      targets:
        Ondas: all
    test:
      targets:
        - OndasTests
    run:
      config: Debug
